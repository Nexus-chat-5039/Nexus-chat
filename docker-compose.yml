version: '3.9'

services:
  # ── Infrastructure ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
    volumes:
      - ./scripts/migrate:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d nexus"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s


  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  pubsub-init:
    image: python:3.12-alpine
    depends_on:
      - pubsub-emulator
    entrypoint: ["/bin/sh", "/scripts/pubsub_emulator_init.sh"]
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: nexus-local
    volumes:
      - ./scripts/seed:/scripts:ro

  # ── Services ──
  nexus-api:
    build:
      context: ./services/nexus-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: .env.local
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  nexus-socket:
    build:
      context: ./services/nexus-socket
      dockerfile: Dockerfile
    ports:
      - "3000:3001"
    env_file: .env.local
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy


  nexus-rag:
    build:
      context: .
      dockerfile: services/nexus-rag/Dockerfile
    ports:
      - "50051:50051"
      - "8000:8000"
    env_file: .env.local
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    volumes:
      - ./services/nexus-rag/app:/app/app

  nexus-ai-gateway:
    build:
      context: .
      dockerfile: services/nexus-ai-gateway/Dockerfile
    ports:
      - "8081:8081"
    env_file: .env.local

  nexus-ai-worker:
    build:
      context: .
      dockerfile: services/nexus-ai-worker/Dockerfile
    env_file: .env.local
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      pubsub-init:
        condition: service_completed_successfully
      nexus-rag:
        condition: service_started
      nexus-ai-gateway:
        condition: service_started

  nexus-billing:
    build:
      context: .
      dockerfile: services/nexus-billing/Dockerfile
    ports:
      - "8082:8082"
    env_file: .env.local
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy



volumes:
  qdrant_storage:

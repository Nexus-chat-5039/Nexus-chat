# -----------------------------------------------------
# nexus-api (Go)
# -----------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-api
  namespace: nexus-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-api
  template:
    metadata:
      labels:
        app: nexus-api
    spec:
      containers:
      - name: nexus-api
        image: gcr.io/nexus-prod-12345/nexus-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: ENV
          value: "production"
        - name: PORT
          value: "8080"
        - name: CORS_ORIGIN
          value: "https://nexuschat.app"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: nexus-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: nexus-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: nexus-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /live
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-api
  namespace: nexus-services
spec:
  selector:
    app: nexus-api
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexus-api-hpa
  namespace: nexus-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexus-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nexus-api-pdb
  namespace: nexus-services
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: nexus-api


# -----------------------------------------------------
# nexus-socket (Node.js)
# -----------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-socket
  namespace: nexus-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-socket
  template:
    metadata:
      labels:
        app: nexus-socket
    spec:
      containers:
      - name: nexus-socket
        image: gcr.io/nexus-prod-12345/nexus-socket:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "2000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-socket
  namespace: nexus-services
spec:
  selector:
    app: nexus-socket
  ports:
  - port: 80
    targetPort: 3000


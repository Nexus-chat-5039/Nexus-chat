  name: nexus-socket
  namespace: nexus-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-socket
  template:
    metadata:
      labels:
        app: nexus-socket
    spec:
      containers:
      - name: nexus-socket
        image: gcr.io/nexus-prod-12345/nexus-socket:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "2000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-socket
  namespace: nexus-services
spec:
  selector:
    app: nexus-socket
  ports:
  - port: 80
    targetPort: 3000


# -----------------------------------------------------
# nexus-api (Go)
# -----------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-api
  namespace: nexus-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-api
  template:
    metadata:
      labels:
        app: nexus-api
    spec:
      containers:
      - name: nexus-api
        image: gcr.io/nexus-prod-12345/nexus-api:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-api
  namespace: nexus-services
spec:
  selector:
    app: nexus-api
  ports:
  - port: 80
    targetPort: 8080

# -----------------------------------------------------
# nexus-socket (Node.js)
# -----------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment

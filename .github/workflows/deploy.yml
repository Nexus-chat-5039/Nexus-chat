name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: cloud-run-source-deploy

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # ============================================================
      # API
      # ============================================================

      - name: Build API
        run: |
          docker build \
            -f services/nexus-api/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/nexus-api:${{ github.sha }} \
            .

      - name: Push API
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/nexus-api:${{ github.sha }}

      - name: Deploy API
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nexus-api
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/nexus-api:${{ github.sha }}
          flags: --port=8080
          vpc_network: default
          env_vars: |
            ENV=production
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            REDIS_URL=REDIS_URL:latest
            JWT_SECRET=JWT_SECRET:latest

      - name: Get API URL
        id: api-url
        run: |
          URL=$(gcloud run services describe nexus-api \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # ============================================================
      # SOCKET
      # ============================================================

      - name: Build Socket
        run: |
          docker build \
            -f services/nexus-socket/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/nexus-socket:${{ github.sha }} \
            .

      - name: Push Socket
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/nexus-socket:${{ github.sha }}

      - name: Deploy Socket
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nexus-socket
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/nexus-socket:${{ github.sha }}
          flags: --port=3001
          vpc_network: default
          env_vars: |
            ENV=production
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            REDIS_URL=REDIS_URL:latest
            JWT_SECRET=JWT_SECRET:latest

      - name: Get Socket URL
        id: socket-url
        run: |
          URL=$(gcloud run services describe nexus-socket \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # ============================================================
      # AI GATEWAY
      # ============================================================

      - name: Build Gateway
        run: |
          docker build \
            -f services/nexus-ai-gateway/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/nexus-ai-gateway:${{ github.sha }} \
            .

      - name: Push Gateway
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/nexus-ai-gateway:${{ github.sha }}

      - name: Deploy Gateway
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nexus-ai-gateway
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/nexus-ai-gateway:${{ github.sha }}
          flags: --port=8081
          vpc_network: default
          env_vars: |
            ENV=production
            GEMINI_MODELS=gemini-3.1-flash-lite
          secrets: |
            GEMINI_API_KEY=GEMINI_API_KEY:latest
            REDIS_URL=REDIS_URL:latest

      - name: Get Gateway URL
        id: gateway-url
        run: |
          URL=$(gcloud run services describe nexus-ai-gateway \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # ============================================================
      # RAG
      # ============================================================

      - name: Build RAG
        run: |
          docker build \
            -f services/nexus-rag/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/nexus-rag:${{ github.sha }} \
            .

      - name: Push RAG
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/nexus-rag:${{ github.sha }}

      - name: Deploy RAG
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nexus-rag
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/nexus-rag:${{ github.sha }}
          flags: --memory=2Gi --cpu=2 --port=8080
          env_vars: |
            QDRANT_HOST=0861747e-3274-417e-ad39-76de14f44eb5.us-east4-0.gcp.cloud.qdrant.io
            QDRANT_PORT=6333
          secrets: |
            QDRANT_API_KEY=QDRANT_API_KEY:latest

      - name: Get RAG URL
        id: rag-url
        run: |
          URL=$(gcloud run services describe nexus-rag \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # ============================================================
      # DEPLOYMENT SUMMARY
      # ============================================================

      - name: Deployment Summary
        run: |
          echo ""
          echo "============================================================"
          echo "                 NEXUS DEPLOYMENT COMPLETE"
          echo "============================================================"
          echo ""
          echo "API:"
          echo "${{ steps.api-url.outputs.url }}"
          echo ""
          echo "Socket:"
          echo "${{ steps.socket-url.outputs.url }}"
          echo ""
          echo "AI Gateway:"
          echo "${{ steps.gateway-url.outputs.url }}"
          echo ""
          echo "RAG:"
          echo "${{ steps.rag-url.outputs.url }}"
          echo ""
          echo "============================================================"